<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Listings | God's Land</title><meta name="description" content="Search and filter verified properties across Nigerian states and LGAs."><link rel="stylesheet" href="css/themes.css"><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="site-header"><div class="container nav-row"><a href="index.html" class="brand">God's Land</a><nav class="nav-links"><a data-nav href="index.html">Home</a><a data-nav href="listings.html">Listings</a><a data-nav href="locations.html">Locations</a><a data-nav href="services.html">Services</a><a data-nav href="about.html">About</a><a data-nav href="contact.html">Contact</a></nav><div class="utility"><form class="global-search"><input placeholder="Search listings"></form><button data-theme-toggle>◐</button><a class="btn btn-outline" href="https://wa.me/2348000000000" target="_blank">WhatsApp</a><button class="mobile-toggle" data-open-menu>☰</button></div></div><div class="mobile-drawer"><div class="mobile-panel"><button data-close-menu>Close</button><a href="index.html">Home</a><a href="listings.html">Listings</a><a href="locations.html">Locations</a><a href="services.html">Services</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></header>
<main class="section"><div class="container"><h1>All Listings</h1><p id="result-count" class="muted"></p>
<div class="filter-bar"><input id="filter-q" placeholder="Keyword"><select id="filter-type"><option value="">Property Type</option><option>Land</option><option>House</option></select><select id="filter-state"></select><select id="filter-lga"></select><select id="filter-sort"><option value="newest">Newest</option><option value="low">Price low to high</option><option value="featured">Featured</option></select><button class="btn" id="apply-filters">Apply</button></div>
<div id="listings-grid" class="grid"></div><div id="empty-state" class="muted" style="display:none">No results found. Try adjusting state, LGA, type, or keyword.</div></div></main>
<footer><div class="container">© <span id="yr"></span> God's Land</div></footer>
<a class="floating-wa" target="_blank" rel="noopener" href="https://wa.me/2348000000000">WA</a>
<script src="data/listings.js"></script><script src="js/theme.js"></script><script src="js/whatsapp.js"></script><script src="js/filters.js"></script><script src="js/app.js"></script>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  populateStateAndLga(document.getElementById('filter-state'), document.getElementById('filter-lga'), true);
  const params = new URLSearchParams(location.search);
  ['q','type','state','lga'].forEach(k=>{const el=document.getElementById('filter-'+k); if (el && params.get(k)) el.value = params.get(k)});

  function render() {
    let result = filterListings(GODS_LAND_LISTINGS, {
      q: document.getElementById('filter-q').value,
      type: document.getElementById('filter-type').value,
      state: document.getElementById('filter-state').value,
      lga: document.getElementById('filter-lga').value
    });
    const sort = document.getElementById('filter-sort').value;
    if (sort === 'low') result.sort((a,b)=>(a.price||0)-(b.price||0));
    if (sort === 'featured') result = result.filter(x=>x.featured);

    document.getElementById('result-count').textContent = `Showing ${result.length} properties`;
    document.getElementById('empty-state').style.display = result.length ? 'none' : 'block';
    document.getElementById('listings-grid').innerHTML = result.map(item => `<article class='property-card card'><img loading='lazy' src='${item.images[0]}' alt='${item.title}'><div class='body'><strong>${item.title}</strong><p class='muted'>${item.type} • ${item.state}, ${item.lga}</p><p>₦${(item.price||0).toLocaleString()}</p><div class='cta-row'><a class='btn btn-outline' href='listing.html?id=${item.id}'>View Details</a><a class='btn' target='_blank' href='${buildWhatsAppLink(item)}'>WhatsApp Enquiry</a></div></div></article>`).join('');
  }

  document.getElementById('apply-filters').addEventListener('click', render);
  document.addEventListener('godsland:applyFilters', render);
  render();
</script>
</body></html>
